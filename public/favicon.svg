<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Clean white circular background -->
  <circle cx="256" cy="256" r="256" fill="#ffffff" />

  <!-- Building skyline mark in black — faithfully recreating the Sanda Estate logo -->
  <g stroke="#111111" stroke-linecap="round">
    <!-- Left Building (3 lines) -->
    <line x1="148" y1="340" x2="148" y2="280" stroke-width="4.5" />
    <line x1="158" y1="340" x2="158" y2="296" stroke-width="4.5" />
    <line x1="168" y1="340" x2="168" y2="264" stroke-width="4.5" />

    <!-- Center Building (8 lines — tallest structure) -->
    <line x1="194" y1="340" x2="194" y2="175" stroke-width="4.5" />
    <line x1="204" y1="340" x2="204" y2="168" stroke-width="4.5" />
    <line x1="214" y1="340" x2="214" y2="166" stroke-width="4.5" />
    <line x1="224" y1="340" x2="224" y2="172" stroke-width="4.5" />
    <line x1="234" y1="340" x2="234" y2="148" stroke-width="4.5" />
    <!-- Peak lines (arch/spire) -->
    <line x1="248" y1="250" x2="248" y2="138" stroke-width="4.5" />
    <line x1="258" y1="245" x2="258" y2="128" stroke-width="4.5" />
    <line x1="268" y1="240" x2="268" y2="120" stroke-width="4.5" />

    <!-- Right Building (5 lines) -->
    <line x1="294" y1="340" x2="294" y2="238" stroke-width="4.5" />
    <line x1="304" y1="340" x2="304" y2="242" stroke-width="4.5" />
    <line x1="314" y1="340" x2="314" y2="248" stroke-width="4.5" />
    <line x1="324" y1="340" x2="324" y2="256" stroke-width="4.5" />
    <line x1="334" y1="340" x2="334" y2="254" stroke-width="4.5" />

    <!-- Base line -->
    <line x1="140" y1="344" x2="342" y2="344" stroke-width="5" />
  </g>

  <!-- "SE" monogram text below the mark -->
  <text x="256" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="8" fill="#111111">SE</text>
</svg>
