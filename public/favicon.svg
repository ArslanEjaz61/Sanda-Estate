<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid black rounded square background — better for favicon clarity -->
  <rect width="512" height="512" rx="80" fill="#111111" />

  <!-- Building skyline — bold, thick, clear at small sizes -->
  <g fill="#c2a76d">
    <!-- Left Building — 3 bars -->
    <rect x="80"  y="270" width="14" height="120" rx="3" />
    <rect x="102" y="290" width="14" height="100" rx="3" />
    <rect x="124" y="245" width="14" height="145" rx="3" />

    <!-- Center Building — tallest, 5 thick bars -->
    <rect x="160" y="155" width="14" height="235" rx="3" />
    <rect x="182" y="145" width="14" height="245" rx="3" />
    <rect x="204" y="140" width="14" height="250" rx="3" />
    <rect x="226" y="148" width="14" height="242" rx="3" />
    <rect x="248" y="120" width="14" height="270" rx="3" />

    <!-- Spire / Peak lines -->
    <rect x="274" y="100" width="14" height="155" rx="3" />
    <rect x="296" y="88"  width="14" height="140" rx="3" />
    <rect x="318" y="78"  width="14" height="125" rx="3" />

    <!-- Right Building — 4 bars -->
    <rect x="354" y="210" width="14" height="180" rx="3" />
    <rect x="376" y="218" width="14" height="172" rx="3" />
    <rect x="398" y="228" width="14" height="162" rx="3" />
    <rect x="420" y="224" width="14" height="166" rx="3" />

    <!-- Bold base line -->
    <rect x="70" y="394" width="374" height="7" rx="3" />
  </g>

  <!-- "SE" text — bold and clear -->
  <text x="256" y="448" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" letter-spacing="12" fill="#c2a76d">SE</text>
</svg>
